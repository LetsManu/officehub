# Claude Code GitHub Actions
#
# Mention @claude in an issue, an issue comment, a pull request comment or a review
# to ask Claude to answer a question or implement a change. For issues, Claude works
# on a new branch and posts a link to open a pull request.
#
# Setup (once): install the Claude GitHub App on this repository and add the
# repository secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
# No secrets are stored in this file.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Let Claude run the project's checks before it proposes a change.
          claude_args: |
            --allowedTools "Bash(cd backend && *),Bash(cd frontend && *),Bash(pip install *),Bash(python -m pytest*),Bash(npm ci*),Bash(npm run *),Bash(npx vitest*)"
