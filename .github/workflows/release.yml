# Release: builds the Docker images, publishes them to the GitHub Container Registry
# and creates a GitHub Release with a ready-to-use compose file for Portainer.
#
# Start a release by pushing a version tag:
#   git tag v1.0.0 && git push origin v1.0.0
# or run it manually under Actions → Release → Run workflow.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.0.0 – must be higher than every earlier release"
        required: true
      rebuild:
        description: "Rebuild an existing version from its own tag (only to repair a broken release)"
        type: boolean
        default: false

permissions:
  contents: write # create the release and tag
  packages: write # push images to ghcr.io

env:
  REGISTRY: ghcr.io

jobs:
  # Never overwrite a release by accident: a new version must not exist yet and must be the highest one, so
  # ":latest" always points to the newest code. A rebuild uses the version's own tag, never other code.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      ref: ${{ steps.check.outputs.ref }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version
        id: check
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REBUILD: ${{ github.event.inputs.rebuild }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="v$VERSION" ;; esac
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$VERSION\" is not a version like v1.2.3."; exit 1
          fi
          git fetch --tags --force --quiet
          HIGHEST="$(git tag -l 'v*.*.*' | grep -Ev "^${VERSION}\$" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          REF="$GITHUB_SHA"
          LATEST=true
          if [ "$REBUILD" = "true" ]; then
            if ! git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
              echo "::error::$VERSION does not exist yet, so there is nothing to rebuild."; exit 1
            fi
            REF="$(git rev-list -n 1 "$VERSION")"
          elif [ "$EVENT" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            NEWEST="$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
            echo "::error::$VERSION was already released. Choose a version higher than $NEWEST."; exit 1
          elif [ "$EVENT" = "push" ] && gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::error::$VERSION was already released."; exit 1
          fi
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            if [ "$REBUILD" != "true" ]; then
              echo "::error::$VERSION is lower than $HIGHEST. Choose a version higher than $HIGHEST."; exit 1
            fi
            LATEST=false # an older version keeps ":latest" on the newest one
          fi
          if ! git show "$REF:frontend/src/lib/changelog.ts" | grep -q "version: '${VERSION#v}'"; then
            echo "::warning::frontend/src/lib/changelog.ts has no entry for ${VERSION#v}, so \"What's new\" will not mention it."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION from $REF (latest: $LATEST)" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  images:
    needs: [check, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, craft]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref }}

      - name: Work out version and image name
        id: vars
        run: |
          echo "version=${{ needs.check.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/officehub-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.vars.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.vars.outputs.version }}
            type=raw,value=latest,enable=${{ needs.check.outputs.latest }}
          labels: |
            org.opencontainers.image.title=OfficeHub ${{ matrix.service }}
            org.opencontainers.image.description=OfficeHub employee self-service portal (${{ matrix.service }})

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # The Windows and Android apps (apps/, see apps.yml)
  apps:
    needs: [check, test]
    uses: ./.github/workflows/apps.yml
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ needs.check.outputs.ref }}
    secrets: inherit

  release:
    needs: [check, images, apps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: apps-dist
          merge-multiple: true

      - name: Prepare release files
        id: vars
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # Pin the compose file to this exact version.
          sed -e "s#ghcr.io/letsmanu/#ghcr.io/${OWNER}/#g" \
              -e "s#:\${OFFICEHUB_VERSION:-latest}#:\${OFFICEHUB_VERSION:-${VERSION#v}}#g" \
              deploy/portainer/docker-compose.yml > dist/docker-compose.yml
          sed "s/^OFFICEHUB_VERSION=.*/OFFICEHUB_VERSION=${VERSION#v}/" deploy/portainer/stack.env > dist/stack.env
          cp docs/deployment-portainer.md dist/DEPLOYMENT.md
          (cd dist && zip -q "officehub-${VERSION}-portainer.zip" docker-compose.yml stack.env DEPLOYMENT.md)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          cat > notes.md <<NOTES
          ## Deploy with Portainer

          1. Portainer → **Stacks → Add stack → Web editor**
          2. Paste \`docker-compose.yml\` from the assets below
          3. Under **Environment variables → Load variables from .env file**, upload \`stack.env\` and adjust it
          4. **Deploy the stack**, then open \`http://<server>:8080\`

          Images:
          - \`ghcr.io/${OWNER}/officehub-backend:${VERSION#v}\`
          - \`ghcr.io/${OWNER}/officehub-frontend:${VERSION#v}\`
          - \`ghcr.io/${OWNER}/officehub-craft:${VERSION#v}\` (WordCraft and DeckCraft in the browser)

          ## Apps

          - **Windows:** \`OfficeHub-Setup.exe\` – installs for the signed-in person (no admin rights needed)
          - **Android:** \`OfficeHub.apk\`

          On first start the apps ask for the address of your OfficeHub. Everyone also finds the downloads in
          OfficeHub under **Install as app**.

          Full guide: \`DEPLOYMENT.md\` (also in the repository under \`docs/deployment-portainer.md\`).
          NOTES
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" dist/docker-compose.yml dist/stack.env dist/officehub-*-portainer.zip \
            apps-dist/OfficeHub-Setup.exe apps-dist/OfficeHub.apk --clobber
          else
            gh release create "$VERSION" \
              --title "OfficeHub $VERSION" \
              --notes-file notes.md \
              --generate-notes \
              --target "${{ needs.check.outputs.ref }}" \
              dist/docker-compose.yml dist/stack.env dist/officehub-*-portainer.zip \
              apps-dist/OfficeHub-Setup.exe apps-dist/OfficeHub.apk
          fi
