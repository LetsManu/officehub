# The browser versions of WordCraft and DeckCraft: static files only. The portal's nginx passes /wordcraft/ and
# /deckcraft/ here and adds its own security headers.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        text/css css;
        text/plain txt;
        image/png png;
        image/svg+xml svg;
        application/manifest+json webmanifest json;
    }
    default_type application/octet-stream;
    gzip on;
    gzip_types application/wasm application/javascript text/css;

    # File names carry a hash: keep them; the page itself is checked every time
    location ~* \.(wasm|js|css|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
