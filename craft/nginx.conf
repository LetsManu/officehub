# The browser versions of WordCraft and DeckCraft: static files only. The portal's nginx passes /wordcraft/ and
# /deckcraft/ here and adds its own security headers.
#
# The apps are large WebAssembly files, so the image carries them compressed ahead of time: Brotli (.br, about a
# fifth of the size) for every current browser, gzip (.gz) for the rest. Nothing is compressed per request.
map $http_accept_encoding $craft_br {
    default "";
    "~*\bbr\b" ".br";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        text/css css;
        text/plain txt;
        image/png png;
        image/svg+xml svg;
        application/manifest+json webmanifest json;
    }
    default_type application/octet-stream;
    gzip on;
    gzip_types application/javascript text/css;
    gzip_static on;

    # File names carry a hash: keep them; the page itself is checked every time
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        if ($craft_br) {
            rewrite ^(.*)$ $1.br last;
        }
    }
    location ~* \.wasm\.br$ {
        internal;
        types { }
        default_type application/wasm;
        gzip off;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
    }
    location ~* \.js\.br$ {
        internal;
        types { }
        default_type application/javascript;
        gzip off;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
    }
    location ~* \.(css|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
