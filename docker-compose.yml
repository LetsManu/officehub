name: officehub

services:
  backend:
    # Prebuilt image from the release (used by Portainer); built locally if it cannot be pulled.
    image: ghcr.io/letsmanu/officehub-backend:${OFFICEHUB_VERSION:-latest}
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_LANGUAGE: ${DEMO_LANGUAGE:-de}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      TIMEZONE: ${TIMEZONE:-Europe/Vienna}
      PORTAL_URL: ${PORTAL_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Office editing and the meeting server switch on by themselves when their containers run.
      # Passwords between them and OfficeHub are made on the first start (in the "shared" volume).
      COLLABORA_URL: ${COLLABORA_URL:-http://collabora:9980}
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-http://onlyoffice}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      JITSI_APP_SECRET: ${JITSI_APP_SECRET:-}
      JITSI_INTERNAL_URL: ${JITSI_INTERNAL_URL:-http://jitsi-web}
      CRAFT_INTERNAL_URL: ${CRAFT_INTERNAL_URL:-http://craft:8080}
      # The server's public IP address for meetings with people outside the office. Empty: what PORTAL_URL's name
      # resolves to. Meetings use the stack's own relay (turn); ICE_SERVERS replaces it with STUN/TURN servers of your own.
      PUBLIC_IP: ${PUBLIC_IP:-${JITSI_PUBLIC_IP:-}}
      ICE_SERVERS: ${ICE_SERVERS:-}
      ICE_USERNAME: ${ICE_USERNAME:-}
      ICE_PASSWORD: ${ICE_PASSWORD:-}
    volumes:
      - officehub-data:/data
      # Nightly backups (Administration → Backups). Set BACKUP_PATH to a folder or NAS share on the server to keep
      # them off the data volume, e.g. BACKUP_PATH=/mnt/nas/officehub-backups
      - ${BACKUP_PATH:-officehub-backups}:/backups
      - shared:/shared
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    image: ghcr.io/letsmanu/officehub-frontend:${OFFICEHUB_VERSION:-latest}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

  # ---- Edit Word, Excel and PowerPoint files in the browser (Collabora runs by default) ----
  # It only talks to OfficeHub inside this stack. Remove this service if you do not want it (needs ~1 GB RAM).
  collabora:
    image: collabora/code:26.04.4.2.1
    restart: unless-stopped
    cap_add:
      - MKNOD
    environment:
      aliasgroup1: http://backend:8000
      dictionaries: de_DE de_AT de_CH en_GB en_US
      extra_params: >-
        --o:ssl.enable=false --o:ssl.termination=false
        --o:net.service_root=/collabora --o:net.frame_ancestors='self'
        --o:net.proto=IPv4 --o:admin_console.enable=false --o:welcome.enable=false

  # Optional second editor: start with COMPOSE_PROFILES=onlyoffice (needs 2–4 GB RAM).
  onlyoffice:
    image: onlyoffice/documentserver:9.2.1
    profiles: ["onlyoffice"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Uses the password OfficeHub made on its first start
    entrypoint: ["/bin/sh", "-c", "export JWT_SECRET=\"$${JWT_SECRET:-$$(cat /shared/onlyoffice_jwt_secret)}\"; exec /app/ds/run-document-server.sh"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - shared:/shared:ro

  # ---- WordCraft and DeckCraft in the browser ----
  # Open-source word processor and presentation program (built from source, static files only, a few MB of RAM).
  # Word and PowerPoint files open there by themselves; HR can switch back to the office editor under
  # Administration -> Office editing. Remove this service if you do not want it.
  craft:
    image: ghcr.io/letsmanu/officehub-craft:${OFFICEHUB_VERSION:-latest}
    build: ./craft
    restart: unless-stopped

  # ---- Finds the server's address in the office network for the meeting servers below (runs once, then stops) ----
  # Only looks at the server's own routing table; nothing is sent anywhere.
  hostip:
    image: busybox:1.37.0
    restart: "no"
    network_mode: host
    command: ["/bin/sh", "-c", "ip route get 192.0.2.1 | sed -n 's/.* src \\([0-9.]*\\).*/\\1/p' > /shared/host_ip; cat /shared/host_ip"]
    volumes:
      - shared:/shared

  # ---- Relay for meetings and calls across networks (people at home, on mobile data) ----
  # Audio and video go directly between the browsers when they can; otherwise this relay of your own forwards them
  # (no outside service). Its password is made on the first start and its public address comes from PORTAL_URL.
  # People outside the office need ports 3478 (UDP and TCP) and 49160-49200 (UDP) open to this server.
  turn:
    image: coturn/coturn:4.18.0-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      hostip:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - >-
        IP="$${PUBLIC_IP:-$$(cat /shared/public_ip 2>/dev/null)}"; IP="$${IP:-$$(cat /shared/host_ip 2>/dev/null)}";
        exec turnserver -n --listening-port=3478 --min-port=49160 --max-port=49200
        --use-auth-secret --static-auth-secret="$$(cat /shared/turn_secret)" --realm=officehub
        --fingerprint --no-cli --no-tls --no-dtls --no-software-attribute --no-multicast-peers
        --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
        --log-file=stdout --simple-log $${IP:+--external-ip=$$IP}
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-${JITSI_PUBLIC_IP:-}}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - shared:/shared:ro
    # Its own network: the relay can never reach the other parts of the stack
    networks: [relay]

  # ---- Jitsi Meet: all meetings and calls go through it while it runs ----
  # Runs by default (needs about 1 GB RAM); remove the four jitsi-* services and meetings run built in. OfficeHub
  # uses it by itself, passwords and the public address are made automatically. People reach it through the
  # portal (/jitsi/, /colibri-ws/); audio and video use UDP port 10000 (open it for people outside the office),
  # with the relay above as fallback. No outside STUN server.
  jitsi-web:
    image: jitsi/web:stable-10978
    restart: unless-stopped
    environment: &jitsi
      PUBLIC_URL: ${PORTAL_URL:-http://localhost:8080}
      TZ: ${TIMEZONE:-Europe/Vienna}
      ENABLE_AUTH: "1"
      AUTH_TYPE: jwt
      ENABLE_GUESTS: "0"
      JWT_APP_ID: officehub
      JWT_APP_SECRET: ${JITSI_APP_SECRET:-}  # empty: the one OfficeHub made (see entrypoint)
      JWT_ACCEPTED_ISSUERS: officehub
      JWT_ACCEPTED_AUDIENCES: officehub
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      JICOFO_AUTH_PASSWORD: ${JITSI_INTERNAL_PASSWORD:-}
      JVB_AUTH_PASSWORD: ${JITSI_INTERNAL_PASSWORD:-}
      ENABLE_XMPP_WEBSOCKET: "1"
      ENABLE_COLIBRI_WEBSOCKET: "1"
      DISABLE_HTTPS: "1"
      ENABLE_HTTP_REDIRECT: "0"
      ENABLE_LETSENCRYPT: "0"
      JVB_ADVERTISE_IPS: ${PUBLIC_IP:-${JITSI_PUBLIC_IP:-}}  # empty: the address OfficeHub found (see entrypoint)
      JVB_DISABLE_STUN: "1"
      # The relay of the stack, also for Jitsi (TURN over TCP when UDP is blocked)
      TURN_PORT: "3478"
      TURN_TRANSPORT: udp,tcp
    networks:
      default:
        aliases: [meet.jitsi]

  jitsi-prosody:
    image: jitsi/prosody:stable-10978
    restart: unless-stopped
    environment: *jitsi
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: &jitsi-secrets
      - /bin/sh
      - -c
      - >-
        H="$${PUBLIC_URL#*://}"; H="$${H%%/*}"; H="$${H%%:*}";
        export JWT_APP_SECRET="$${JWT_APP_SECRET:-$$(cat /shared/jitsi_app_secret)}"
        JICOFO_AUTH_PASSWORD="$${JICOFO_AUTH_PASSWORD:-$$(cat /shared/jitsi_internal_password)}"
        JVB_AUTH_PASSWORD="$${JVB_AUTH_PASSWORD:-$$(cat /shared/jitsi_internal_password)}"
        JVB_ADVERTISE_IPS="$$(echo "$${JVB_ADVERTISE_IPS:-$$(cat /shared/public_ip 2>/dev/null)},$$(cat /shared/host_ip 2>/dev/null)" | tr ',' '\n' | grep . | sort -u | paste -sd, -)"
        TURN_CREDENTIALS="$$(cat /shared/turn_secret 2>/dev/null)" TURN_HOST="$$H";
        exec /init
    volumes:
      - shared:/shared:ro
    networks:
      default:
        aliases: [xmpp.meet.jitsi]

  jitsi-jicofo:
    image: jitsi/jicofo:stable-10978
    restart: unless-stopped
    environment: *jitsi
    depends_on: [jitsi-prosody]
    entrypoint: *jitsi-secrets
    volumes:
      - shared:/shared:ro

  jitsi-jvb:
    image: jitsi/jvb:stable-10978
    restart: unless-stopped
    environment: *jitsi
    ports:
      - "10000:10000/udp"
    depends_on:
      jitsi-prosody:
        condition: service_started
      hostip:
        condition: service_completed_successfully
    entrypoint: *jitsi-secrets
    volumes:
      - shared:/shared:ro

volumes:
  # Holds the SQLite database (officehub.db) and uploaded files (uploads/).
  officehub-data:
  officehub-backups:
  onlyoffice-data:
  # Passwords OfficeHub makes on its first start for the office and meeting servers
  shared:

networks:
  default:
  relay:
