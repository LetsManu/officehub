name: officehub

services:
  backend:
    # Prebuilt image from the release (used by Portainer); built locally if it cannot be pulled.
    image: ghcr.io/letsmanu/officehub-backend:${OFFICEHUB_VERSION:-latest}
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_LANGUAGE: ${DEMO_LANGUAGE:-de}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      TIMEZONE: ${TIMEZONE:-Europe/Vienna}
      PORTAL_URL: ${PORTAL_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Office editing (optional, see the Collabora / ONLYOFFICE services below)
      COLLABORA_URL: ${COLLABORA_URL:-}
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      # Video meetings (optional, see the Jitsi services below)
      JITSI_APP_SECRET: ${JITSI_APP_SECRET:-}
    volumes:
      - officehub-data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    image: ghcr.io/letsmanu/officehub-frontend:${OFFICEHUB_VERSION:-latest}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

  # ---- Optional: edit Word, Excel and PowerPoint files in the browser ----
  # Start one (or both) with COMPOSE_PROFILES=collabora and/or onlyoffice, and set COLLABORA_URL /
  # ONLYOFFICE_URL for the backend. They only talk to OfficeHub inside this stack.
  collabora:
    image: collabora/code:26.04.4.2.1
    profiles: ["collabora"]
    restart: unless-stopped
    cap_add:
      - MKNOD
    environment:
      aliasgroup1: http://backend:8000
      dictionaries: de_DE de_AT de_CH en_GB en_US
      extra_params: >-
        --o:ssl.enable=false --o:ssl.termination=${COLLABORA_SSL_TERMINATION:-false}
        --o:net.service_root=/collabora --o:net.frame_ancestors=${PORTAL_URL:-http://localhost:8080}
        --o:net.proto=IPv4 --o:admin_console.enable=false --o:welcome.enable=false

  onlyoffice:
    image: onlyoffice/documentserver:9.2.1
    profiles: ["onlyoffice"]
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-me}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data

  # ---- Optional: video meetings and calls with your own Jitsi Meet server ----
  # Start with COMPOSE_PROFILES=jitsi (can be combined, e.g. collabora,jitsi) and set JITSI_APP_SECRET.
  # People reach it through the portal (/jitsi/ and /colibri-ws/); audio and video use UDP port 10000.
  jitsi-web:
    image: jitsi/web:stable-10978
    profiles: ["jitsi"]
    restart: unless-stopped
    environment: &jitsi
      PUBLIC_URL: ${PORTAL_URL:-http://localhost:8080}
      TZ: ${TIMEZONE:-Europe/Vienna}
      ENABLE_AUTH: "1"
      AUTH_TYPE: jwt
      ENABLE_GUESTS: "0"
      JWT_APP_ID: officehub
      JWT_APP_SECRET: ${JITSI_APP_SECRET:-}
      JWT_ACCEPTED_ISSUERS: officehub
      JWT_ACCEPTED_AUDIENCES: officehub
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      JICOFO_AUTH_PASSWORD: ${JITSI_INTERNAL_PASSWORD:-change-me-too}
      JVB_AUTH_PASSWORD: ${JITSI_INTERNAL_PASSWORD:-change-me-too}
      ENABLE_XMPP_WEBSOCKET: "1"
      ENABLE_COLIBRI_WEBSOCKET: "1"
      DISABLE_HTTPS: "1"
      ENABLE_HTTP_REDIRECT: "0"
      ENABLE_LETSENCRYPT: "0"
      JVB_ADVERTISE_IPS: ${JITSI_PUBLIC_IP:-}
    networks:
      default:
        aliases: [meet.jitsi]

  jitsi-prosody:
    image: jitsi/prosody:stable-10978
    profiles: ["jitsi"]
    restart: unless-stopped
    environment: *jitsi
    networks:
      default:
        aliases: [xmpp.meet.jitsi]

  jitsi-jicofo:
    image: jitsi/jicofo:stable-10978
    profiles: ["jitsi"]
    restart: unless-stopped
    environment: *jitsi
    depends_on: [jitsi-prosody]

  jitsi-jvb:
    image: jitsi/jvb:stable-10978
    profiles: ["jitsi"]
    restart: unless-stopped
    environment: *jitsi
    ports:
      - "10000:10000/udp"
    depends_on: [jitsi-prosody]

volumes:
  # Holds the SQLite database (officehub.db) and uploaded files (uploads/).
  officehub-data:
  onlyoffice-data:
