<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>OfficeHub</title>
    <link rel="stylesheet" href="style.css" />
    <script src="ring.js" defer></script>
  </head>
  <body class="ring">
    <div class="caller">
      <span class="avatar" id="initials" aria-hidden="true"></span>
      <div>
        <p class="name" id="name"></p>
        <p class="muted" id="text"></p>
      </div>
    </div>
    <div class="actions">
      <button id="decline" class="decline" type="button"></button>
      <button id="accept" class="accept" type="button"></button>
    </div>
  </body>
</html>
