# WebSocket upgrade for the office editors
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind an HTTPS reverse proxy the office editor has to use secure WebSockets (found out by itself)
map $http_x_forwarded_proto $editor_ws {
    https   wss;
    default ws;
}

server {
    listen 8080;
    server_name _;
    # Docker's internal name service: containers are looked up when used
    resolver 127.0.0.11 valid=10s ipv6=off;
    root /usr/share/nginx/html;
    index index.html;

    # Must be at least MAX_UPLOAD_MB from the backend settings.
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
    # worker-src blob: lib-jitsi-meet starts its frame encryption worker (encrypted meetings) from a blob that loads
    # /jitsi/libs/lib-jitsi-meet.e2ee-worker.js; scripts themselves still only come from this server.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Editing together in DeckCraft: the first change carries the whole presentation with its pictures
    location ^~ /api/craft/collab/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        client_max_body_size 200m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        # Looked up on use, so an updated (recreated) backend container is found again
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Optional office servers in the same stack (see docs/deployment-portainer.md). Looked up when
    # used, so the portal still starts when they are not installed.

    # Collabora Online, configured with net.service_root=/collabora
    location /collabora/ {
        set $collabora http://collabora:9980;
        proxy_pass $collabora;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 36000s;
        client_max_body_size 200m;
        proxy_set_header Accept-Encoding "";
        sub_filter 'data-host = "ws://' 'data-host = "$editor_ws://';
        sub_filter_once on;
        # The editor sends its own security headers; this line stops the portal's from being added.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ONLYOFFICE Docs, served under /onlyoffice/
    location /onlyoffice/ {
        set $onlyoffice onlyoffice;
        rewrite ^/onlyoffice/(.*)$ /$1 break;
        proxy_pass http://$onlyoffice;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 36000s;
        client_max_body_size 200m;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Jitsi Meet (video meetings): the library, the signalling connection and the video bridge channel
    location /jitsi/ {
        set $jitsi http://jitsi-web:80;
        rewrite ^/jitsi/(.*)$ /$1 break;
        proxy_pass $jitsi;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /colibri-ws/ {
        set $jitsi http://jitsi-web:80;
        proxy_pass $jitsi;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Spaces as a network drive (WebDAV) for Explorer, Finder and desktop programs; sign-in with an app password
    location /dav {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # WordCraft and DeckCraft in the browser (optional container, COMPOSE_PROFILES=craft). Their pages start the
    # WebAssembly with a small inline script; connect-src 'self' keeps them from reaching anything outside.
    location ~ ^/(wordcraft|deckcraft)/ {
        set $craft http://craft:8080;
        proxy_pass $craft;
        proxy_http_version 1.1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
